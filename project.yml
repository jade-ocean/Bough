name: Bough
options:
  bundleIdPrefix: com.wangyuyang
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.6.4

configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

targets:
  Bough:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Bough
        excludes:
          - "Info.plist"
          - "Bough.entitlements"
    settings:
      base:
        INFOPLIST_FILE: Bough/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Bough/Bough.entitlements
        PRODUCT_NAME: Bough
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  BoughTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BoughTests
    dependencies:
      - target: Bough
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: "$(TARGET_NAME)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bough.app/Contents/MacOS/Bough"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Bough:
    build:
      targets:
        Bough: all
        BoughTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BoughTests
